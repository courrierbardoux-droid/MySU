<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Fond -->
  <rect width="192" height="192" rx="32" fill="#2F5496"/>

  <!-- Carton (corps) -->
  <rect x="36" y="80" width="120" height="84" rx="6" fill="#F5C842"/>
  <!-- Carton (rabat gauche fermé) -->
  <path d="M36 80 L96 68 L96 80 Z" fill="#E0A800"/>
  <!-- Carton (rabat droit fermé) -->
  <path d="M96 68 L156 80 L96 80 Z" fill="#F5C842"/>
  <!-- Ligne de fermeture carton -->
  <line x1="36" y1="80" x2="156" y2="80" stroke="#C48A00" stroke-width="3"/>
  <!-- Ruban adhésif vertical -->
  <rect x="88" y="68" width="16" height="96" rx="2" fill="#AED6F1" opacity="0.7"/>

  <!-- Texte MySU -->
  <text x="96" y="148" font-family="Arial, sans-serif" font-weight="bold" font-size="34"
        fill="#2F5496" text-anchor="middle" letter-spacing="1">MySU</text>

  <!-- Petit checkmark (validation) en haut à droite du carton -->
  <circle cx="148" cy="72" r="14" fill="#27AE60"/>
  <polyline points="141,72 146,78 156,64" fill="none" stroke="white" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
